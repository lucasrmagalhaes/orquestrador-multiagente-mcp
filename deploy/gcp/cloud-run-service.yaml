apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orquestrador
  labels:
    app: orquestrador
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJETO/orquestrador/orquestrador:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: LLM_PROVIDER
              value: mock
            - name: ORQUESTRADOR_MCP
              value: stdio
            - name: ORQUESTRADOR_RAIZ
              value: /app
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 10
