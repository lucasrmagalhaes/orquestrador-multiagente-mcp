name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o projeto
        run: pip install -e ".[dev]"
      - name: Rodar a suíte
        run: pytest -q
        env:
          LLM_PROVIDER: mock
          ORQUESTRADOR_MCP: processo
