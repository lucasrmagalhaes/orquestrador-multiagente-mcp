[project]
name = "orquestrador-multiagente"
version = "0.1.0"
description = "Orquestrador multiagente com LangGraph, servidores MCP e guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.24,<1.3",
  "langgraph-checkpoint-sqlite>=3.1.3,<4",
  "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
langfuse = ["langfuse>=2.0"]

[project.scripts]
orquestrador = "orquestrador.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orquestrador = ["dados_exemplo/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
