services:
  orquestrador:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: mock
      ORQUESTRADOR_MCP: stdio
      ORQUESTRADOR_RAIZ: /app
      PORT: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
